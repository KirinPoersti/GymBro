{% extends "base.html" %}
{% block content %}

<h2 class="page-title">{{ d }}</h2>

<div class="cards">
  <a class="card" href="{{ url_for('training_bp.training', d=d) }}">Training</a>
  <a class="card" href="{{ url_for('meals_bp.meals_view', d=d) }}">Meals</a>
</div>

<style>
  .title {
    font-weight: normal;
  }

  .page-title {
    text-align: center;
    margin-bottom: 18px;
  }

  .cards {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 160px;
    height: 90px;
    border: none;
    border-radius: 25px;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: #111;
    text-decoration: none;

    box-shadow:
      0 1px 2px rgba(0,0,0,.08),
      0 8px 24px rgba(0,0,0,.10);
    transition: box-shadow .2s ease, transform .2s ease, background .2s ease;
  }

  .card:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.25);
    box-shadow:
      0 2px 6px rgba(0,0,0,.10),
      0 14px 32px rgba(0,0,0,.16);
  }

  .card:focus-visible {
    outline: none;
    box-shadow:
      inset 0 0 0 3px rgba(122,167,255,1),
      0 2px 6px rgba(0,0,0,.10),
      0 14px 32px rgba(0,0,0,.16);
  }
</style>

{% endblock %}
